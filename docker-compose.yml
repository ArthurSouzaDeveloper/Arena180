services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: freebarber
      POSTGRES_PASSWORD: freebarber
      POSTGRES_DB: freebarber
    ports:
      - "5432:5432"
    volumes:
      - freebarber-db-data:/var/lib/postgresql/data

volumes:
  freebarber-db-data:
