services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestquadra
    ports:
      - "5432:5432"
    volumes:
      - gestquadra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gestquadra?schema=public
      JWT_SECRET: change-me
      JWT_EXPIRES_IN: 7d
      UPLOADS_DIR: uploads
      CORS_ORIGIN: http://localhost:8082
    ports:
      - "4000:4000"
    volumes:
      - gestquadra_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    ports:
      - "8082:80"
    depends_on:
      - backend

volumes:
  gestquadra_postgres_data:
  gestquadra_uploads:
