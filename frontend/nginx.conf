server {
    listen 80;
    server_name arena180.com.br www.arena180.com.br _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name arena180.com.br www.arena180.com.br _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Docker's embedded DNS (127.0.0.11) resolves the "backend" service name.
    # A plain `proxy_pass http://backend:4000` resolves that hostname once,
    # statically, when nginx parses this config - if the backend container's
    # network isn't registered in Docker's DNS at that exact instant (a
    # startup race), nginx refuses to start at all ("host not found in
    # upstream") and keeps crash-looping. Routing proxy_pass through a
    # variable forces nginx to resolve "backend" dynamically per-request via
    # this resolver instead, so a slow-to-register backend just means the
    # first request retries rather than nginx never starting.
    resolver 127.0.0.11 valid=10s;

    # proxy_pass here deliberately has NO path after $backend_upstream. When
    # proxy_pass's target depends on a variable, nginx does not do its usual
    # "replace the matched location prefix with the proxy_pass URI" rewrite -
    # any static path written after the variable is sent to the upstream
    # verbatim instead, on every request, regardless of what URI the client
    # actually requested (confirmed live: every request here was landing on
    # the backend as a literal "/api/", not the real "/api/auth/login" etc. -
    # the whole public API was broken). Leaving proxy_pass with no URI at all
    # makes nginx forward the client's original request URI unmodified, which
    # is exactly right here since it already includes "/api/" or "/uploads/".
    location /api/ {
        set $backend_upstream backend:4000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        set $backend_upstream backend:4000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
