name: Deploy to VPS

on:
  push:
    branches:
      - claude/gestquadra-management-system-qh3piz
  workflow_dispatch:
    inputs:
      superadmin_name:
        description: "Nome do superadmin a criar (deixe em branco para pular)"
        required: false
      superadmin_email:
        description: "E-mail do superadmin"
        required: false
      superadmin_password:
        description: "Senha do superadmin"
        required: false
      arena_name:
        description: "Nome da primeira arena a criar (deixe em branco para pular)"
        required: false
      arena_slug:
        description: "Slug da arena"
        required: false
      arena_admin_name:
        description: "Nome do admin da arena"
        required: false
      arena_admin_email:
        description: "E-mail do admin da arena"
        required: false
      arena_admin_password:
        description: "Senha do admin da arena"
        required: false
      list_arenas:
        description: "Listar todas as arenas e e-mails de admin (true para listar)"
        required: false
      setup_https:
        description: "Configurar certificado HTTPS via Let's Encrypt para o domínio (true para executar)"
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy project files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "backend,frontend,docker-compose.prod.yml"
          target: "/opt/gestquadra"
          strip_components: 0

      - name: Install Docker, write env file and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: POSTGRES_PASSWORD,JWT_SECRET,PUBLIC_ORIGIN,API_ORIGIN,TOKEN_ENCRYPTION_KEY
          script: |
            set -e

            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
            fi

            cat > /opt/gestquadra/.env.prod <<EOF
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            PUBLIC_ORIGIN=${PUBLIC_ORIGIN}
            API_ORIGIN=${API_ORIGIN}
            TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
            EOF

            cd /opt/gestquadra

            PORT_LISTENERS=$(ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null)
            echo "--- diagnosing port 80/443 usage before deploy ---"
            echo "$PORT_LISTENERS" | grep -E ':(80|443)\b' || echo "(nothing found listening on 80/443)"

            # A crashed/killed container can leave an orphaned docker-proxy
            # process still bound to its published host port - `docker compose
            # down` won't touch it since it isn't tracked as part of any
            # container, so "up -d" then fails forever with "port is already
            # allocated" no matter how cleanly the compose project itself is
            # torn down. Kill only the exact PIDs reported as listening on
            # 80/443 (a broad `pkill -f docker-proxy` previously killed the
            # SSH session itself - too blunt).
            STALE_PIDS=$(echo "$PORT_LISTENERS" | grep -E ':(80|443)\b' | grep -oP 'pid=\K[0-9]+' | sort -u)
            for pid in $STALE_PIDS; do
              echo "killing stale port listener pid $pid"
              kill -9 "$pid" || true
            done
            sleep 1

            docker compose -f docker-compose.prod.yml --env-file .env.prod down --remove-orphans || true
            docker compose -f docker-compose.prod.yml --env-file .env.prod build

            # Even after the old container is stopped/removed and its
            # docker-proxy killed, the kernel/iptables can take a moment to
            # actually release the host port - "up -d" run immediately after
            # can still hit "port is already allocated" as a pure timing race,
            # with no process left to kill by the time it happens. Retry the
            # (already-built, so cheap) up instead of failing the whole deploy.
            # --force-recreate matters here: a failed attempt can leave the
            # frontend container half-created with its port publish never
            # actually applied - retrying a plain "up -d" then just starts
            # that same broken container instead of setting up its network
            # fresh, so nginx runs but nothing is listening on the host's
            # 80/443 at all.
            up_ok=false
            for attempt in 1 2 3 4 5 6; do
              if docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --force-recreate --remove-orphans; then
                up_ok=true
                break
              fi
              echo "up -d failed (attempt $attempt/6), waiting for the port to free up..."
              sleep 5
            done

            if [ "$up_ok" != "true" ]; then
              echo "up -d kept failing after 6 attempts - giving up (needs manual investigation on the VPS itself, not a further automated retry)"
              exit 1
            fi

            docker image prune -f

            echo "--- backend logs (diagnostic) ---"
            sleep 5
            docker compose -f docker-compose.prod.yml logs backend --tail 80 || true

            echo "--- frontend/nginx logs (diagnostic) ---"
            docker compose -f docker-compose.prod.yml logs frontend --tail 80 || true

            echo "--- container status (diagnostic) ---"
            docker compose -f docker-compose.prod.yml ps || true

            echo "--- local HTTP/HTTPS reachability (diagnostic) ---"
            curl -sko /dev/null -w "https://localhost -> %{http_code}\n" https://localhost || echo "curl to https://localhost failed"
            curl -so /dev/null -w "http://localhost -> %{http_code}\n" http://localhost || echo "curl to http://localhost failed"
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PUBLIC_ORIGIN: ${{ secrets.PUBLIC_ORIGIN }}
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}

      - name: Seed superadmin / arena (manual dispatch only)
        if: ${{ inputs.superadmin_email != '' || inputs.arena_slug != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: SUPERADMIN_NAME,SUPERADMIN_EMAIL,SUPERADMIN_PASSWORD,ARENA_NAME,ARENA_SLUG,ARENA_ADMIN_NAME,ARENA_ADMIN_EMAIL,ARENA_ADMIN_PASSWORD
          script: |
            set -e
            cd /opt/gestquadra

            exec_in_backend() {
              for i in $(seq 1 20); do
                if docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T backend sh -c "$1"; then
                  return 0
                fi
                echo "backend not ready yet, retrying in 3s ($i/20)..."
                sleep 3
              done
              return 1
            }

            if [ -n "$SUPERADMIN_EMAIL" ]; then
              exec_in_backend "SUPERADMIN_NAME='$SUPERADMIN_NAME' SUPERADMIN_EMAIL='$SUPERADMIN_EMAIL' SUPERADMIN_PASSWORD='$SUPERADMIN_PASSWORD' node dist/scripts/create-superadmin.js"
            fi

            if [ -n "$ARENA_SLUG" ]; then
              exec_in_backend "QUADRA_NAME='$ARENA_NAME' QUADRA_SLUG='$ARENA_SLUG' ADMIN_NAME='$ARENA_ADMIN_NAME' ADMIN_EMAIL='$ARENA_ADMIN_EMAIL' ADMIN_PASSWORD='$ARENA_ADMIN_PASSWORD' node dist/scripts/create-quadra.js"
            fi
        env:
          SUPERADMIN_NAME: ${{ inputs.superadmin_name }}
          SUPERADMIN_EMAIL: ${{ inputs.superadmin_email }}
          SUPERADMIN_PASSWORD: ${{ inputs.superadmin_password }}
          ARENA_NAME: ${{ inputs.arena_name }}
          ARENA_SLUG: ${{ inputs.arena_slug }}
          ARENA_ADMIN_NAME: ${{ inputs.arena_admin_name }}
          ARENA_ADMIN_EMAIL: ${{ inputs.arena_admin_email }}
          ARENA_ADMIN_PASSWORD: ${{ inputs.arena_admin_password }}

      - name: Setup HTTPS certificate (manual dispatch only)
        if: ${{ inputs.setup_https == 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e

            if ! command -v certbot >/dev/null 2>&1; then
              apt-get update -y
              apt-get install -y certbot
            fi

            mkdir -p /var/www/certbot

            certbot certonly --webroot -w /var/www/certbot \
              -d arena180.com.br -d www.arena180.com.br \
              --agree-tos --non-interactive --register-unsafely-without-email \
              --keep-until-expiring

            cd /opt/gestquadra
            docker compose -f docker-compose.prod.yml --env-file .env.prod restart frontend
            sleep 3
            echo "--- frontend logs (diagnostic) ---"
            docker compose -f docker-compose.prod.yml logs frontend --tail 40

      - name: List arenas (manual dispatch only)
        if: ${{ inputs.list_arenas == 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            cd /opt/gestquadra
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T backend node -e "
              const { PrismaClient } = require('@prisma/client');
              const prisma = new PrismaClient();
              (async () => {
                const arenas = await prisma.quadra.findMany({
                  include: { users: { select: { name: true, email: true, role: true } } },
                  orderBy: { createdAt: 'desc' },
                });
                for (const a of arenas) {
                  console.log('---');
                  console.log('Arena:', a.name, '| slug:', a.slug, '| ativa:', a.active);
                  for (const u of a.users) {
                    console.log('  admin:', u.name, '<' + u.email + '>');
                  }
                }
                const superadmins = await prisma.user.findMany({ where: { role: 'SUPERADMIN' }, select: { name: true, email: true } });
                console.log('---');
                console.log('Superadmins:');
                for (const s of superadmins) {
                  console.log('  ', s.name, '<' + s.email + '>');
                }
                await prisma.\$disconnect();
              })();
            "
